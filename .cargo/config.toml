# ── Unstable features ──
[unstable]
codegen-backend = true

# ── Dev builds: Cranelift backend for much faster codegen ──
# Requires the `rustc-codegen-cranelift-preview` component (see rust-toolchain.toml).
[profile.dev]
codegen-backend = "cranelift"

# ── Environment variables ──
[env]
CC_x86_64_unknown_linux_musl = { value = "tools/ccpicker", relative = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-Z", "threads=12"]
linker = "tools/linkerpicker"

[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Z", "threads=12", "-C", "target-feature=+crt-static"]

[alias]
musl = "build --release --target x86_64-unknown-linux-musl"
rel = "build --release"
dev = "build"

chk = "check --workspace"
tst = "test --workspace"
