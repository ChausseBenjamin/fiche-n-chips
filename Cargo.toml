[package]
name = "fiche-n-chips"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/slog/lib.rs"

[dependencies]
actix-web = "4.13.0"
axum = { version = "0.7", optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = "1.0.228"
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["actix", "axum"]
actix = []
axum = ["dep:axum"]

# Test for slog LogValue implementation
specialization = []
