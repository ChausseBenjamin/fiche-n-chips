[workspace]
members = [
	"app",
	"rslog",
]
resolver = "3"

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1}
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_substraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversion = "deny"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.release]
lto             = "fat"
codegen-units   = 1
strip           = "symbols"
opt-level       = 3         # speed-optimized
panic           = "abort"   # no catch_unwind needed in this server
overflow-checks = false     # explicit (already default for release)
debug-assertions = false    # explicit (already default for release)
incremental     = false
