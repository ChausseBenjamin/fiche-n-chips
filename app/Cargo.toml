[package]
name = "fiche-n-chips"
version = "0.1.0"
edition = "2024"

[lints]
# Inherit workspace lint policy.
workspace = true

[dependencies]

# Cli development
clap = { version = "4.6.1", features = ["derive", "env"] }
humantime = "2.3.0"

# Web interactions
tokio = {version = "1.0.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"]}
tokio-util = { version = "0.7", features = ["rt"] }
actix-web = { version = "4", default-features = false, features = ["macros"] }

# Specialized tools (specific to this project)
turso = { version = "0.6.0", default-features = false }   # sqlite database
xxhash-rust = { version = "0.8.15", features = ["xxh3"] } # non-cryptographic hashing
brotli = "8.0.2"                                          # text compression

# General purpose tools
rslog = { path = "../rslog", features = ["json"] }
thiserror = "2.0.18"
const_format = "0.2.36"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
minify-html = "0.18.1"
brotli = "8.0.2"
