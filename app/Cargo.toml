[package]
name = "fiche-n-chips"
version = "1.0.0"
edition = "2024"

[lints]
workspace = true

[dependencies]

# Web interactions
tokio      = { version = "1.0.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"]}
tokio-util = { version = "0.7",   features = ["rt"] }
actix-rt   = { version = "2",     features = ["signal"] }
actix-web  = { version = "4",    default-features = false, features = ["macros"] }
awc        = { version = "3",    default-features = false, features = ["rustls-0_23-webpki-roots"] }
rustls     = { version = "0.23", default-features = false, features = ["ring", "tls12"] }

# Specialized
sqlx        = { version = "0.9", features = ["runtime-tokio","sqlite","macros","migrate"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
brotli      = { version = "8.0.2" }

# General purpose
thiserror    = { version = "2.0.18" }
const_format = { version = "0.2.36" }
serde_json   = { version = "1.0.149" }
rslog        = { version = "0.1.0",   features = ["json"], path = "../rslog" }
serde        = { version = "1.0.228", features = ["derive"] }
clap         = { version = "4.6.1",   features = ["derive", "env"] }
humantime    = { version = "2.3.0" }
bytes        = { version = "1.11" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
minify-html  = { version = "0.18.1" }
brotli       = { version = "8.0.2" }
