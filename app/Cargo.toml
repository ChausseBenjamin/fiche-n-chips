[package]
name = "fiche-n-chips"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = ">=4"
brotli = "8.0.2"
clap = { version = "4.6.1", features = ["derive", "env"] }
humantime = "2.3.0"
rslog = { path = "../rslog", features = ["actix", "json"] }
tokio = {version = "1.0.1", features = ["full"]}
turso = "0.6.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
