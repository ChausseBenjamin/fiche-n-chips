[package]
name = "fiche-n-chips"
version = "0.1.0"
edition = "2021"

[dependencies]

# Cli development
clap = { version = "4.6.1", features = ["derive", "env"] }
humantime = "2.3.0"

# Web interactivity
tokio = {version = "1.0.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"]}
# actix-web = { version = "4", default-features = false, features = ["macros"] }

# Tools
turso = { version = "0.6.0", default-features = false }
brotli = "8.0.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
rslog = { path = "../rslog", features = ["actix", "json"] }
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
