<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 1yr.ca</title>
  <meta name="description" content="The page you requested could not be found.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="1yr.ca">
  <meta property="og:url" content="https://1yr.ca/">
  <meta property="og:title" content="1yr.ca — terminal pastebin &amp; url shortener">
  <meta property="og:description" content="Paste straight from your terminal, get a link that lasts up to a year. URL shortening, no account, hosted in Canada.">
  <meta property="og:image" content="https://1yr.ca/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="1yr.ca wordmark above a terminal showing: echo &quot;I Love Timbits&quot; | nc 1yr.ca 443">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="1yr.ca — terminal pastebin &amp; url shortener">
  <meta name="twitter:description" content="Paste straight from your terminal, get a link that lasts up to a year. URL shortening, no account, hosted in Canada.">
  <meta name="twitter:image" content="https://1yr.ca/og-image.png">
  <meta name="twitter:image:alt" content="1yr.ca wordmark above a terminal showing: echo &quot;I Love Timbits&quot; | nc 1yr.ca 443">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="preload" href="/misc/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- main.css is the shared base CSS. It is inlined here at build time
       (see `data-build-inline` in app/build.rs) so each page ships as one
       self-contained document and the critical CSS can never paint late.
       The href keeps this file renderable when served straight from disk. -->
  <link rel="stylesheet" href="main.css" data-build-inline>
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 700;
      src: url('/misc/jetbrainsmono-latin.woff2') format('woff2');
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    .icon-svg {
      width: 1rem;
      height: 1rem;
      min-width: 1rem;
      min-height: 1rem;
      fill: currentColor;
      flex-shrink: 0;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .error-section {
      text-align: center;
      padding: 2rem 0;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: var(--red-bright);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .error-message {
      color: var(--fg-muted);
      margin-bottom: 2rem;
    }

    .error-message::before {
      content: "$ ";
      color: var(--red);
    }

    .terminal-output {
      background-color: var(--bg-alt);
      border: 1px solid var(--border);
      border-left: 3px solid var(--red);
      border-radius: 4px;
      padding: 1rem;
      text-align: left;
      max-width: 400px;
      margin: 0 auto 2rem;
      font-size: 0.85rem;
    }

    .terminal-output .line {
      margin-bottom: 0.5rem;
    }

    .terminal-output .line:last-child {
      margin-bottom: 0;
    }

    .terminal-output .prompt {
      color: var(--red);
    }

    .terminal-output .command {
      color: var(--fg);
    }

    .terminal-output .output {
      color: var(--fg-muted);
    }

		.terminal-output #slug-id {
			font-weight: 700;
			color: var(--yellow);
		}

		.terminal-output .sorry-msg {
			font-weight: 700;
			color: var(--red-muted);
		}

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      transition: border-color 0.2s ease;
    }

    .home-link:hover {
      border-color: var(--red);
      text-decoration: none;
    }

    .home-link .icon-svg {
      width: 1rem;
      height: 1rem;
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="logo"><span>1yr</span>.ca</a>
      <p class="tagline">terminal pastebin &amp; url shortener &mdash; hosted in canada</p>
    </header>

    <main>
      <div class="error-section">
        <div class="error-code">404</div>
        <p class="error-message">file not found</p>

        <div class="terminal-output">
          <div class="line"><span class="prompt">$ </span><span class="command">curl https://1yr.ca/<span id="slug-curl">????</span></span></div>
          <div class="line">
						<span class="output">
							You requested `<span id="slug-id">????</span>` but it doesn't seem to exist<br>
							<span class="sorry-msg">Sorry Eh...</span>
						</span>
					</div>
        </div>

        <a href="/" class="home-link">
          <svg class="icon-svg"><use href="/misc/icons.svg#home"/></svg>
          <span>back to home</span>
        </a>
      </div>
    </main>

    <footer>
      <p>made with <span class="maple">&#127809;</span> in Canada</p>
      <p style="margin-top: 0.5rem; font-size: 0.8rem;">&copy; <span id="year"></span> 1yr.ca</p>
    </footer>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    var path = window.location.pathname;
    var slug = path.replace(/^\/+|\/+$/g, '');
    if (slug) {
      document.getElementById('slug-curl').textContent = slug;
      document.getElementById('slug-id').textContent = slug;
    }
  </script>
</body>
</html>
