<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 1yr.ca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --bg-alt: #1a1a1a;
            --fg: #e0e0e0;
            --fg-muted: #808080;
            --red: #d62828;
            --red-bright: #ef233c;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::selection {
            background-color: var(--red);
            color: var(--fg);
        }

        a {
            color: var(--red-bright);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--fg);
            text-decoration: underline;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px dashed var(--border);
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--red-bright);
        }

        .tagline {
            color: var(--fg-muted);
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .tagline::before {
            content: "$ ";
            color: var(--red);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .error-section {
            text-align: center;
            padding: 2rem 0;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--red-bright);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-message {
            color: var(--fg-muted);
            margin-bottom: 2rem;
        }

        .error-message::before {
            content: "$ ";
            color: var(--red);
        }

        .terminal-output {
            background-color: var(--bg-alt);
            border: 1px solid var(--border);
            border-left: 3px solid var(--red);
            border-radius: 4px;
            padding: 1rem;
            text-align: left;
            max-width: 400px;
            margin: 0 auto 2rem;
            font-size: 0.85rem;
        }

        .terminal-output .line {
            margin-bottom: 0.5rem;
        }

        .terminal-output .line:last-child {
            margin-bottom: 0;
        }

        .terminal-output .prompt {
            color: var(--red);
        }

        .terminal-output .command {
            color: var(--fg);
        }

        .terminal-output .output {
            color: var(--fg-muted);
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-alt);
            border: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            transition: border-color 0.2s ease;
        }

        .home-link:hover {
            border-color: var(--red);
            text-decoration: none;
        }

        .home-link .material-symbols-outlined {
            font-size: 1rem;
        }

        footer {
            border-top: 1px dashed var(--border);
            margin-top: 3rem;
            padding-top: 1.5rem;
            text-align: center;
            color: var(--fg-muted);
            font-size: 0.85rem;
        }

        footer .maple {
            color: var(--red-bright);
        }

        @media (max-width: 600px) {
            html {
                font-size: 14px;
            }

            .container {
                padding: 1.5rem 1rem;
            }

            .error-code {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="logo"><span>1yr</span>.ca</a>
            <p class="tagline">terminal pastebin &mdash; hosted in canada for up to 1 year</p>
        </header>

        <main>
            <div class="error-section">
                <div class="error-code">404</div>
                <p class="error-message">cat: No such file or directory</p>

                <div class="terminal-output">
                    <div class="line"><span class="prompt">$ </span><span class="command">curl https://1yr.ca/????</span></div>
                    <div class="line"><span class="output">error: paste not found or expired</span></div>
                </div>

                <a href="/" class="home-link">
                    <span class="material-symbols-outlined">home</span>
                    <span>back to home</span>
                </a>
            </div>
        </main>

        <footer>
            <p>made with <span class="maple">&#127809;</span> in Canada</p>
            <p style="margin-top: 0.5rem; font-size: 0.8rem;">&copy; <span id="year"></span> 1yr.ca</p>
        </footer>
    </div>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
