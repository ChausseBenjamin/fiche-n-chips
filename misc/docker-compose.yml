services:
  fiche-n-chips:
    image: chaussebenjamin/fiche-n-chips:latest
    ports:
      - "9001:9001"   # HTTP
      - "9002:9002"   # TCP pastebin
    volumes:
      # Persistent database storage
      - fiche-data:/data
    environment:
      # ── Server ──
      PUBLIC_ADDR: "http://localhost:9001"
      MAINTAINER_EMAIL: "john@example.com"
      LISTEN_ADDR: "0.0.0.0"
      HTTP_PORT: "9001"
      PASTE_PORT: "9002"
      # Optional: directory with custom HTML files (overrides embedded)
      # HTML_DIR: "/path/to/html"

      # ── Database / Internal ──
      DB_PATH: "/data/store.db"
      DB_CACHE: "32"
      USER_DELETION_WINDOW: "10m"
      RETENTION: "365days"
      SLUG_LEN: "4"
      CLEANUP_INTERVAL: "1h"
      SHUTDOWN_TIMEOUT: "10s"

      # ── Pastebin ──
      PASTE_MAX_SIZE: "256KB"
      PASTE_READ_TIMEOUT: "1s"

      # ── Redirects ──
      REDIRECT_MAX_SIZE: "2KB"
      REDIRECT_SLUG_LIMIT: "144"

      # ── Logging ──
      LOG_LEVEL: "info"
      LOG_OUTPUT: "stdout"
      LOG_FORMAT: "json"
      LOG_TRACE: "false"

volumes:
  fiche-data:
