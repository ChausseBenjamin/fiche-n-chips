title: '{{ if eq .kind "redirect" }}URL Redirect{{ else }}Paste{{ end }} expiring in {{ .bracket }}'

message: |-
  {{ if eq .kind "redirect" -}}
  "{{ .slug }}" will no longer point to the currently configured URL in {{ .bracket }}.

  Once it has expired, you may recreate it. If you intend on using this short URL soon (in QR codes, emails, etc...), you may want to generate an alternative url in the meantime.
  {{- else -}}
  `{{ .slug }}` will be deleted in {{ .bracket }}.
  If its content is important, make a backup before it's too late by visiting
  https://1yr.ca/{{.slug}}
  {{- end }}

priority: "{{ .pri }}"
click: '{{ if eq .kind "paste" }}https://1yr.ca/{{.slug}}{{ end }}'
